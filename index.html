<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <meta name="description" content="Persoonlijk krachttrainingslogboek. Werkt volledig offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kracht" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Krachttraining</title>
    <script>
      // Zet het thema vóór het eerste beeld, zodat je bij het openen geen
      // flits van het verkeerde thema ziet. Blijft in de pas met src/lib/thema.ts.
      ;(function () {
        try {
          var keuze = localStorage.getItem('kracht.thema') || 'systeem'
          var licht =
            keuze === 'licht' ||
            (keuze === 'systeem' && window.matchMedia('(prefers-color-scheme: light)').matches)
          if (licht) {
            document.documentElement.classList.add('licht')
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#f6f5f4')
          }
        } catch (e) {
          // Geen opslag beschikbaar: dan start de app gewoon donker.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Deze app heeft JavaScript nodig om te werken.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
